name: Auth Service CI/CD

on:
  push:
    paths:
      - 'auth/**'
  pull_request:
    paths:
      - 'auth/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mod-cache-${{ runner.os }}-$(hashFiles('auth/go.sum'))

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run Tests
        run: go test ./... -v

  sonar-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.projectKey=weather-auth
            -Dsonar.organization=mostafagheta13
            -Dsonar.sources=.
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Debug Sonar scanner report (for troubleshooting)
        if: always()
        run: |
          echo "=== Listing .scannerwork folder (auth) ==="
          if [ -d "./.scannerwork" ]; then ls -la ./.scannerwork; else echo "./.scannerwork does not exist"; fi
          echo "=== report-task.txt contents (if exists) ==="
          if [ -f "./.scannerwork/report-task.txt" ]; then sed -n '1,200p' ./.scannerwork/report-task.txt; else echo "report-task.txt not found"; fi
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth
    needs: sonar-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: auth-service
          path: ./auth
          format: HTML
          out: reports

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: auth-owasp-report
          path: reports

  docker-build:
    runs-on: ubuntu-latest
    needs: dependency-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image into local Docker daemon
        run: |
          echo "Building auth image into local Docker daemon"
          docker build -f ./auth/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-auth:${{ github.sha }} ./auth

      - name: Verify image exists
        run: |
          docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" | grep "${{ secrets.DOCKERHUB_USERNAME }}/weather-auth:${{ github.sha }}" || (echo "Image not found" && exit 1)

      - name: Save image artifact
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/weather-auth:${{ github.sha }}
          echo "Saving $IMAGE to weather-auth.tar"
          docker save -o weather-auth.tar "$IMAGE"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-auth-image
          path: weather-auth.tar

  trivy-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: weather-auth-image
          path: .

      - name: Load image into Docker daemon (if artifact present)
        run: |
          if [ -f weather-auth.tar ]; then
            echo "Loading weather-auth.tar into Docker daemon"
            docker load -i weather-auth.tar || true
          else
            echo "No weather-auth.tar artifact found"
          fi

      - name: Restore Trivy cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('auth/go.sum') }}

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/weather-auth:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Generate Trivy JSON report
        if: always()
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/weather-auth:${{ github.sha }}
          echo "Generating Trivy JSON report for $IMAGE"
          trivy image --format json --output trivy-report.json "$IMAGE" || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-auth
          path: trivy-report.json

  docker-push:
    needs: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: weather-auth-image
          path: .

      - name: Load image into Docker daemon (for push)
        run: |
          if [ -f weather-auth.tar ]; then
            echo "Loading weather-auth.tar into Docker daemon for push"
            docker load -i weather-auth.tar || true
          else
            echo "No weather-auth.tar artifact found"
          fi

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-auth:${{ github.sha }}
