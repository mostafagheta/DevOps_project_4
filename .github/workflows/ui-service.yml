name: UI Service CI/CD

on:
  push:
    paths:
      - 'UI/**'
  pull_request:
    paths:
      - 'UI/**'

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./UI

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test -- --watchAll=false

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.projectKey=weather-ui
            -Dsonar.organization=mostafagheta13
            -Dsonar.sources=.
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Debug Sonar scanner report (for troubleshooting)
        if: always()
        run: |
          echo "=== Listing .scannerwork folder (UI) ==="
          if [ -d "./UI/.scannerwork" ]; then ls -la ./UI/.scannerwork; else echo "./UI/.scannerwork does not exist"; fi
          echo "=== report-task.txt contents (if exists) ==="
          if [ -f "./UI/.scannerwork/report-task.txt" ]; then sed -n '1,200p' ./UI/.scannerwork/report-task.txt; else echo "report-task.txt not found"; fi
          echo "=== SONAR_HOST_URL (from secrets) ==="
          echo "${{ secrets.SONAR_HOST_URL }}"
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # - name: SonarQube Quality Gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #   with:
      #     scanMetadataReportFile: ./UI/.scannerwork/report-task.txt

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ui-service
          path: ./UI
          format: HTML
          out: reports

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: ui-owasp-report
          path: reports

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Generate Trivy JSON report
        if: always()
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          echo "Generating Trivy JSON report for $IMAGE"
          # trivy is installed by the previous action and should be available in PATH
          trivy image --format json --output trivy-report.json "$IMAGE" || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}