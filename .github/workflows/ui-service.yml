name: UI Service CI/CD

on:
  push:
    paths:
      - 'UI/**'
  pull_request:
    paths:
      - 'UI/**'

jobs:
  # Build and test the UI. Caches npm to speed up subsequent runs.
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UI
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: npm-cache-${{ runner.os }}-$(hashFiles('UI/package-lock.json'))

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test -- --watchAll=false

  # Sonar scan can run in parallel with build/test since it only needs source files.
  sonar-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UI
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.projectKey=weather-ui
            -Dsonar.organization=mostafagheta13
            -Dsonar.sources=.
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Debug Sonar scanner report (for troubleshooting)
        if: always()
        run: |
          echo "=== Listing .scannerwork folder (UI) ==="
          if [ -d "./.scannerwork" ]; then ls -la ./.scannerwork; else echo "./.scannerwork does not exist"; fi
          echo "=== report-task.txt contents (if exists) ==="
          if [ -f "./.scannerwork/report-task.txt" ]; then sed -n '1,200p' ./.scannerwork/report-task.txt; else echo "report-task.txt not found"; fi
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # OWASP dependency check is independent and can run in parallel.
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UI
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ui-service
          path: ./UI
          format: HTML
          out: reports

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: ui-owasp-report
          path: reports

  # Docker build (uses buildx and GitHub Actions cache to speed up layer caching). It will push the image
  # so that Trivy can scan the pushed image. Runs in parallel with other independent jobs.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (with cache)
        uses: docker/build-push-action@v4
        with:
          context: ./UI
          file: ./UI/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Trivy scans the pushed image. Depends on docker-build job to ensure image is available.
  trivy-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Trivy cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Generate Trivy JSON report
        if: always()
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          echo "Generating Trivy JSON report for $IMAGE"
          trivy image --format json --output trivy-report.json "$IMAGE" || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json