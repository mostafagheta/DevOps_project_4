name: UI Service CI/CD

on:
  push:
    paths:
      - "UI/**"
  pull_request:
    paths:
      - "UI/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UI
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: npm-cache-${{ runner.os }}-$(hashFiles('UI/package-lock.json'))

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test -- --watchAll=false

  sonar-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UI
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.projectKey=weather-ui
            -Dsonar.organization=mostafagheta13
            -Dsonar.sources=.
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Debug Sonar scanner report (for troubleshooting)
        if: always()
        run: |
          echo "=== Listing .scannerwork folder (UI) ==="
          if [ -d "./.scannerwork" ]; then ls -la ./.scannerwork; else echo "./.scannerwork does not exist"; fi
          echo "=== report-task.txt contents (if exists) ==="
          if [ -f "./.scannerwork/report-task.txt" ]; then sed -n '1,200p' ./.scannerwork/report-task.txt; else echo "report-task.txt not found"; fi
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UI
    needs: sonar-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ui-service
          path: ./UI
          format: HTML
          out: reports

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: ui-owasp-report
          path: reports

  docker-build:
    runs-on: ubuntu-latest
    needs: dependency-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image into local Docker daemon
        run: |
          echo "Building image into local Docker daemon"
          docker build -f ./UI/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }} ./UI

      - name: Verify image exists
        run: |
          docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" | grep "${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}" || (echo "Image not found" && exit 1)

      - name: Save image artifact
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          echo "Saving $IMAGE to weather-ui.tar"
          docker save -o weather-ui.tar "$IMAGE"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-ui-image
          path: weather-ui.tar

  trivy-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: weather-ui-image
          path: .

      - name: Load image into Docker daemon (if artifact present)
        run: |
          if [ -f weather-ui.tar ]; then
            echo "Loading weather-ui.tar into Docker daemon"
            docker load -i weather-ui.tar || true
          else
            echo "No weather-ui.tar artifact found"
          fi

      - name: Restore Trivy cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Generate Trivy JSON report
        if: always()
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}
          echo "Generating Trivy JSON report for $IMAGE"
          trivy image --format json --output trivy-report.json "$IMAGE" || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  # Push the image only after trivy-scan completes (and artifacts uploaded)
  docker-push:
    needs: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: weather-ui-image
          path: .

      - name: Load image into Docker daemon (for push)
        run: |
          if [ -f weather-ui.tar ]; then
            echo "Loading weather-ui.tar into Docker daemon for push"
            docker load -i weather-ui.tar || true
          else
            echo "No weather-ui.tar artifact found"
          fi

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}

  update-manifests:
    needs: docker-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update K8s manifest with new image tag
        run: |
          NEW_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:${{ github.sha }}"
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ui:.*|image: ${NEW_IMAGE}|g" K8S/ui/deployment.yaml
          echo "Updated K8S/ui/deployment.yaml with image: ${NEW_IMAGE}"

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add K8S/ui/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update ui image to ${{ github.sha }}"
          git push
